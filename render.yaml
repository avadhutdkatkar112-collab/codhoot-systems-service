# CodHoot native-compiler execution service — Render blueprint.
#
# This repository IS the execution server for these languages: Ada, COBOL, D, Fortran, Nim, Pascal and Assembly all compile to native code and all install from the same Debian repositories onto one gcc base, so they share an image the way the interpreters share theirs.
#
# Contract with codhoot-backend (internal/execution):
#   POST /compile   signed with HMAC(timestamp + path + sha256(body)) keyed by
#                   CODHOOT_INTERNAL_SECRET. Unsigned or tampered requests get
#                   401 — the service refuses every unauthenticated call.
#                   The request's "language" field selects the toolchain.
#   GET /health     and /health/live stay open: Render health checks and the
#                   keepalive pinger must never need a signature.
#
# Point the backend at this service with ONE variable, which covers every
# language it serves:
#   COMPILER_IMAGE_SYSTEMS_SERVICE_URL=https://<this service>.onrender.com
# The mapping is read at backend startup, so set the variable and restart the
# backend service.
#
# Free-tier notes: the instance sleeps after ~15 min of no traffic, so the
# first compile after idle pays a cold start (up to 30-60 s). The backend
# treats HTML and transient 5xx on /compile as "waking up" and retries.
services:
  - type: web
    name: codhoot-systems-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Render routes traffic to the port the service listens on; the image
      # defaults to 8081, so pin it here instead of relying on the image.
      - key: PORT
        value: "10000"
      # Each in-flight toolchain costs both a timeslice and memory on the
      # 0.1 CPU / 512 MB box; requests beyond the ceiling queue to their own
      # deadline instead of OOM-ing the container.
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      # Must be the SAME value as the backend's CODHOOT_INTERNAL_SECRET:
      # it is the HMAC key that makes signed requests verifiable.
      - key: CODHOOT_INTERNAL_SECRET
        sync: false
